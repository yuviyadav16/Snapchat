name: Build Snapchat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # IMPORTANT: Install Android SDK Platform 35 properly
      - name: Install Android SDK 35
        run: |
          echo "Installing Android SDK Platform 35..."

          yes | sdkmanager --licenses || true

          sdkmanager --update

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking android.jar..."
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          echo "Android SDK 35 is ready."

      - name: Generate Android Folder & Apply Fixes
        run: |
          mv lib/main.dart temp_main.dart

          flutter create \
            --project-name snapchat_offline \
            --platforms=android \
            .

          mv temp_main.dart lib/main.dart

          # App name
          sed -i 's/android:label="snapchat_offline"/android:label="Snapchat"/g' \
            android/app/src/main/AndroidManifest.xml

          # Camera permission
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA"/>' \
            android/app/src/main/AndroidManifest.xml

          # Storage permissions
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' \
            android/app/src/main/AndroidManifest.xml

          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' \
            android/app/src/main/AndroidManifest.xml

          # Force Android SDK 35
          sed -i 's/flutter.compileSdkVersion/35/g' \
            android/app/build.gradle

          sed -i 's/flutter.targetSdkVersion/35/g' \
            android/app/build.gradle

          # Show final SDK settings
          echo "===== build.gradle ====="
          grep -n "compileSdk\|targetSdk" android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Gal Package
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev/" -path "*/gal-*/android/build.gradle" \
            -exec sed -i 's/flutter.compileSdkVersion/35/g' {} + || true

          find "$HOME/.pub-cache/hosted/pub.dev/" -path "*/gal-*/android/build.gradle" \
            -exec sed -i 's/flutter.targetSdkVersion/35/g' {} + || true

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # Clean old Android/Gradle build files
      - name: Clean Flutter Build
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf build

          flutter pub get

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Checking Android 35..."

          ls -lh "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          echo "Checking Build Tools..."
          ls -ld "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
